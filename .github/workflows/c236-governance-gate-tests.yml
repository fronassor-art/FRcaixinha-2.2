name: C236 governance offline tests

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/c236-governance-gate-pilot.yml'
      - '.github/workflows/c236-governance-gate-tests.yml'
      - '.github/scripts/c236_governance_gate.py'
      - '.github/scripts/test_c236_governance_gate.py'

permissions:
  contents: read

jobs:
  c236-governance-offline:
    name: c236-governance-offline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout PR for read-only offline tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Run adversarial offline tests
        run: python -B -m unittest discover -s .github/scripts -p 'test_c236_governance_gate.py' -v
