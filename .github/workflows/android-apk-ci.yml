name: Android APK CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk-ci.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.44.9
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.9'
          channel: stable

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build unsigned-for-production debug APK
        run: flutter build apk --debug --no-pub

      - name: Verify generated APK
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk

  # Temporary presentation build for PR #69. Only its AGE ciphertext is uploaded.
  pf-demo-debug-apk:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 69 &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == 'fronassor-art/FRcaixinha-2.2' &&
      github.event.pull_request.head.ref == 'feat/f2-05-pf-full-offline-demo-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.44.9
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.9'
          channel: stable

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build PF demo debug APK
        run: flutter build apk --debug --no-pub --dart-define=FRC_PF_DEMO=true

      - name: Verify APK identity and plaintext hash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$apk"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          package_line="$("$aapt_bin" dump badging "$apk" | grep '^package:')"
          case "$package_line" in
            "package: name='com.example.frcaixinha' "*) ;;
            *) echo 'Unexpected APK application ID' >&2; exit 1 ;;
          esac
          printf 'APK_APPLICATION_ID=com.example.frcaixinha\n'
          printf 'APK_PLAINTEXT_BYTES=%s\n' "$(stat -c %s "$apk")"
          printf 'APK_PLAINTEXT_SHA256='
          sha256sum "$apk" | cut -d ' ' -f 1

      - name: Encrypt APK with public AGE recipient
        run: |
          set -euo pipefail
          if ! command -v age >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends age
          fi
          apk=build/app/outputs/flutter-apk/app-debug.apk
          encrypted=build/app/outputs/flutter-apk/app-debug.apk.age
          age -r age1qfsfth8aqeqldwnrtvzj3ft50yqaynj2nfkaf409ymhkh5r9ea5sxe9hnk -o "$encrypted" "$apk"
          test -s "$encrypted"
          if cmp -s "$apk" "$encrypted"; then
            echo 'AGE output matches plaintext' >&2
            exit 1
          fi
          printf 'APK_ENCRYPTED_BYTES=%s\n' "$(stat -c %s "$encrypted")"
          printf 'APK_ENCRYPTED_SHA256='
          sha256sum "$encrypted" | cut -d ' ' -f 1

      - name: Upload encrypted APK only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pf-demo-pr69-${{ github.event.pull_request.head.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk.age
          if-no-files-found: error
          retention-days: 3
